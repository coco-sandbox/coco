name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  GO_VERSION: '1.23'
  ZIG_VERSION: '0.14'

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Go fmt
        run: go fmt ./...

      - name: Go vet
        run: go vet ./...

      - name: Build
        run: make build-go

      - name: Run tests
        run: make test-go

      - name: Build release binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/coco-gateway ./cmd/coco-gateway
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/coco-master ./cmd/coco-master
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/coco-node ./cmd/coco-node
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/cococtl ./cmd/cococtl
          ls -la bin/

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 7

      - name: Upload release binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-binaries
          path: bin/
          retention-days: 7

  zig:
    runs-on: ubuntu-latest
    container: ghcr.io/ziglang/rig:${{ env.ZIG_VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: |
          zig fmt --check daemon/coco-visor/src/
          zig fmt --check daemon/coco-agent/src/
          zig fmt --check daemon/coco-fork/src/

      - name: Build release
        run: make build-zig

      - name: Test
        run: make test-zig

      - name: Upload release binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zig-binaries
          path: |
            daemon/coco-visor/zig-out/bin/*
            daemon/coco-agent/zig-out/bin/*
            daemon/coco-fork/zig-out/bin/*
          retention-days: 7

  eBPF:
    runs-on: ubuntu-latest
    container:
      image: quay.io/sysprog21/docker-bpf-builder:latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile eBPF programs
        run: |
          cd ebpf
          for f in xdp/*.bpf.c from_sandbox/*.bpf.c from_host/*.bpf.c from_world/*.bpf.c shaper/*.bpf.c; do
            name=$(basename "$f" .bpf.c)
            clang -O2 -target bpf -D__TARGET_ARCH_x86 -Iheaders -c "$f" -o "${name}.o"
          done

      - name: Verify eBPF objects
        run: |
          cd ebpf
          file *.o

      - name: Upload eBPF objects
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ebpf-objects
          path: ebpf/*.o
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: [go, zig]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push coco-gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: cmd/coco-gateway/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}/coco-gateway:latest
            ghcr.io/${{ github.repository }}/coco-gateway:${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push coco-master
        uses: docker/build-push-action@v5
        with:
          context: .
          file: cmd/coco-master/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}/coco-master:latest
            ghcr.io/${{ github.repository }}/coco-master:${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push coco-node
        uses: docker/build-push-action@v5
        with:
          context: .
          file: cmd/coco-node/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}/coco-node:latest
            ghcr.io/${{ github.repository }}/coco-node:${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push cocovisor
        uses: docker/build-push-action@v5
        with:
          context: daemon/coco-visor
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}/cocovisor:latest
            ghcr.io/${{ github.repository }}/cocovisor:${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push cococtl
        uses: docker/build-push-action@v5
        with:
          context: .
          file: cmd/cococtl/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}/cococtl:latest
            ghcr.io/${{ github.repository }}/cococtl:${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration:
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Start infrastructure
        run: |
          docker-compose up -d

      - name: Wait for coco-gateway to be healthy
        run: |
          echo "Waiting for coco-gateway to be healthy..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4747/health | grep -q '"healthy":true'; then
              echo "coco-gateway is healthy after ${i} attempts"
              exit 0
            fi
            echo "Attempt $i/60: still waiting..."
            sleep 2
          done
          echo "Timeout waiting for coco-gateway to be healthy"
          curl -v http://localhost:4747/health || true
          docker-compose logs || true
          exit 1

      - name: Run smoke tests
        run: |
          cd scripts
          chmod +x smoke_test.sh
          ./smoke_test.sh || true

      - name: Cleanup
        if: always()
        run: |
          docker-compose down -v
