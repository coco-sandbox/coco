version: '3.8'

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    environment:
      - ETCD_NAME=etcd
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_INITIAL_CLUSTER_TOKEN=coco-etcd
    ports:
      - "2379:2379"
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  coco-master:
    build:
      context: .
      dockerfile: cmd/coco-master/docker/Dockerfile
    ports:
      - "4746:4746"
      - "4747:4747"
      - "9090:9090"
    volumes:
      - coco-run:/run/coco
      - coco-lib:/var/lib/coco
    environment:
      - COCO_ETCD_ENDPOINTS=etcd:2379
      - COCO_CLUSTER_ENABLED=true
      - COCO_LOG_LEVEL=info
    depends_on:
      etcd:
        condition: service_healthy
    restart: unless-stopped

  coco-node:
    build:
      context: .
      dockerfile: cmd/coco-node/docker/Dockerfile
    ports:
      - "4748:4748"
    volumes:
      - coco-run:/run/coco
      - coco-lib:/var/lib/coco
    privileged: true
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/kvm:/dev/kvm
    environment:
      - COCO_MASTER_ADDR=coco-master:4746
      - COCO_ETCD_ENDPOINTS=etcd:2379
      - COCO_CLUSTER_ENABLED=true
      - COCO_POOL_SIZE=5
      - COCO_LOG_LEVEL=info
    depends_on:
      - coco-master
    restart: unless-stopped

  coco-gateway:
    build:
      context: .
      dockerfile: cmd/coco-gateway/docker/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - coco-run:/run/coco
      - coco-lib:/var/lib/coco
    environment:
      - COCO_MASTER_ADDR=coco-master:4746
      - COCO_LOG_LEVEL=info
    depends_on:
      - coco-master
    restart: unless-stopped

volumes:
  coco-run:
  coco-lib:
  etcd-data:
