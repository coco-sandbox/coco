version: '3.8'

services:
  coco-core:
    build:
      context: .
      dockerfile: core/Dockerfile
    ports:
      - "4747:4747"
    volumes:
      - coco-run:/run/coco
      - coco-lib:/var/lib/coco
    privileged: true
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/kvm:/dev/kvm
    environment:
      - RUST_LOG=info
    restart: unless-stopped

  cocovisor:
    build:
      context: .
      dockerfile: src/cocovisor/Dockerfile
    volumes:
      - coco-run:/run/coco
      - coco-lib:/var/lib/coco
    privileged: true
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/kvm:/dev/kvm

volumes:
  coco-run:
  coco-lib: