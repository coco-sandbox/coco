version: '3.8'

services:
  coco-core:
    build:
      context: .
      dockerfile: core/Dockerfile
    ports:
      - "4747:4747"
      - "4748:4748"
      - "9090:9090"
    volumes:
      - coco-run:/run/coco
      - coco-lib:/var/lib/coco
    privileged: true
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/kvm:/dev/kvm
    environment:
      - COCO_LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4747/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  cocovisor:
    build:
      context: .
      dockerfile: src/cocovisor/Dockerfile
    volumes:
      - coco-run:/run/coco
      - coco-lib:/var/lib/coco
    privileged: true
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/kvm:/dev/kvm
    restart: unless-stopped

volumes:
  coco-run:
  coco-lib:
