apiVersion: v1
kind: ServiceAccount
metadata:
  name: coco-operator
  namespace: coco-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coco-operator
  namespace: coco-system
rules:
  - apiGroups: ["coco.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coco.io"]
    resources: ["sandboxes/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coco-operator
  namespace: coco-system
subjects:
  - kind: ServiceAccount
    name: coco-operator
    namespace: coco-system
roleRef:
  kind: Role
  name: coco-operator
  apiGroup: rbac.authorization.k8s.io
