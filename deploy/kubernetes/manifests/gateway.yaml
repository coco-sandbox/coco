apiVersion: v1
kind: Service
metadata:
  name: coco-gateway
  namespace: coco-system
spec:
  selector:
    app: coco-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 4747
      targetPort: 4747
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coco-gateway
  namespace: coco-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: coco-gateway
  template:
    metadata:
      labels:
        app: coco-gateway
    spec:
      containers:
        - name: gateway
          image: coco-gateway:latest
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 4747
              name: grpc
          env:
            - name: COCO_MASTER_ADDR
              value: "coco-master:4746"
            - name: COCO_LOG_LEVEL
              value: "info"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
