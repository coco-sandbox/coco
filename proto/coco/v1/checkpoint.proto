syntax = "proto3";

package coco.v1;

option go_package = "coco/proto/generated/v1";

// =============================================================================
// Checkpoint Service (Detailed checkpoint operations for coco-checkpoint daemon)
// =============================================================================

service CheckpointService {
  rpc Create(CreateRequest) returns (CreateResponse);
  rpc List(ListRequest) returns (ListResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Restore(RestoreRequest) returns (RestoreResponse);
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
}

enum CheckpointCompression {
  CHECKPOINT_COMPRESSION_UNSPECIFIED = 0;
  CHECKPOINT_COMPRESSION_NONE = 1;
  CHECKPOINT_COMPRESSION_ZSTD = 2;
  CHECKPOINT_COMPRESSION_LZ4 = 3;
}

enum CheckpointStage {
  CHECKPOINT_STAGE_UNSPECIFIED = 0;
  CHECKPOINT_STAGE_MEMORY = 1;
  CHECKPOINT_STAGE_DISK = 2;
  CHECKPOINT_STAGE_FINALIZING = 3;
}

// Detailed checkpoint metadata (extends coco.Checkpoint)
message CheckpointDetail {
  string id = 1;
  string sandbox_id = 2;
  string name = 3;
  string path = 4;
  int64 size_bytes = 5;
  bool is_compressed = 6;
  CheckpointCompression compression = 7;
  int64 memory_size_bytes = 8;
  int64 disk_size_bytes = 9;
  int64 duration_ms = 10;
  bool incremental = 11;
  string parent_checkpoint_id = 12;
  map<string, string> metadata = 13;
}

message CreateRequest {
  string sandbox_id = 1;
  string name = 2;
  CheckpointCompression compression = 3;
  bool incremental = 4;
  int64 memory_pages_limit = 5;
}

message CreateResponse {
  string checkpoint_id = 1;
  int64 size_bytes = 2;
  int64 memory_size_bytes = 3;
  int64 disk_size_bytes = 4;
  int64 duration_ms = 5;
}

message ListRequest {
  string sandbox_id = 1;
  bool include_expired = 2;
}

message ListResponse {
  repeated CheckpointDetail checkpoints = 1;
}

message DeleteRequest {
  string checkpoint_id = 1;
}

message DeleteResponse {}

message RestoreRequest {
  string checkpoint_id = 1;
  string target_sandbox_id = 2;
  bool suspended = 3;
}

message RestoreResponse {
  string sandbox_id = 1;
  uint32 vsock_cid = 2;
  int64 duration_ms = 3;
}

message GetStatusRequest {
  string checkpoint_id = 1;
}

message GetStatusResponse {
  CheckpointDetail checkpoint = 1;
  CheckpointStage stage = 2;
  int32 progress_percent = 3;
  int64 bytes_written = 4;
  int64 total_bytes = 5;
}