syntax = "proto3";

package coco.v1;

option go_package = "coco/proto/generated/v1";

import "google/protobuf/timestamp.proto";
import "proto/coco/v1/coco.proto"; // For ClusterInfo, Node, Sandbox, SandboxState, etc.
import "proto/coco/v1/cluster.proto"; // For ListNodesRequest, GetNodeRequest, etc.

// =============================================================================
// Master Service (Cluster coordination, leader election, scheduling)
// =============================================================================

service MasterService {
  // Scheduling
  rpc ScheduleSandbox(ScheduleSandboxRequest) returns (ScheduleSandboxResponse);
  rpc GetSchedule(GetScheduleRequest) returns (GetScheduleResponse);

  // Cluster management
  rpc GetClusterInfo(GetClusterInfoRequest) returns (GetClusterInfoResponse);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse);
  rpc DrainNode(DrainNodeRequest) returns (DrainNodeResponse);

  // Leader election
  rpc RegisterLeader(RegisterLeaderRequest) returns (RegisterLeaderResponse);
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);

  // Sandbox tracking
  rpc TrackSandbox(TrackSandboxRequest) returns (TrackSandboxResponse);
  rpc UntrackSandbox(UntrackSandboxRequest) returns (UntrackSandboxResponse);
  rpc UpdateSandboxState(UpdateSandboxStateRequest) returns (UpdateSandboxStateResponse);

  // Failover
  rpc InitiateFailover(InitiateFailoverRequest) returns (InitiateFailoverResponse);
  rpc GetFailoverStatus(GetFailoverStatusRequest) returns (GetFailoverStatusResponse);
}

// =============================================================================
// Scheduling Messages
// =============================================================================

message ScheduleSandboxRequest {
  string name = 1;
  string template_id = 2;
  int32 memory_mb = 3;
  int32 vcpus = 4;
  map<string, string> labels = 5;
  string preferred_node_id = 6;
  string affinity_node_id = 7;
}

message ScheduleSandboxResponse {
  string sandbox_id = 1;
  string assigned_node_id = 2;
  string assigned_addr = 3;
}

message GetScheduleRequest {
  string sandbox_id = 1;
}

message GetScheduleResponse {
  string sandbox_id = 1;
  string assigned_node_id = 2;
  string state = 3;
}

// =============================================================================
// Leader Election Messages
// =============================================================================

message RegisterLeaderRequest {
  string node_id = 1;
  string addr = 2;
  int64 term = 3;
  int64 last_log_index = 4;
}

message RegisterLeaderResponse {
  bool success = 1;
  int64 term = 2;
}

message RequestVoteRequest {
  string candidate_id = 1;
  int64 term = 2;
  int64 last_log_index = 3;
  int64 last_log_term = 4;
}

message RequestVoteResponse {
  bool granted = 1;
  int64 term = 2;
}

// =============================================================================
// Sandbox Tracking Messages
// =============================================================================

message TrackSandboxRequest {
  Sandbox sandbox = 1;
}

message TrackSandboxResponse {}

message UntrackSandboxRequest {
  string sandbox_id = 1;
}

message UntrackSandboxResponse {}

message UpdateSandboxStateRequest {
  string sandbox_id = 1;
  SandboxState state = 2;
  string host_node = 3;
}

message UpdateSandboxStateResponse {}

// =============================================================================
// Failover Messages
// =============================================================================

enum FailoverState {
  FAILOVER_STATE_UNSPECIFIED = 0;
  FAILOVER_STATE_HEALTHY = 1;
  FAILOVER_STATE_DEGRADED = 2;
  FAILOVER_STATE_RECOVERING = 3;
  FAILOVER_STATE_FAILED = 4;
}

message InitiateFailoverRequest {
  string failed_node_id = 1;
}

message InitiateFailoverResponse {
  bool success = 1;
  repeated string sandboxes_to_migrate = 2;
  int32 migration_count = 3;
}

message GetFailoverStatusRequest {
  string node_id = 1;
}

message GetFailoverStatusResponse {
  string node_id = 1;
  FailoverState state = 2;
  int32 sandboxes_migrated = 3;
  int32 sandboxes_pending = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp completed_at = 6;
}