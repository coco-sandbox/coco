syntax = "proto3";

package coco.v1;

option go_package = "github.com/coco-sandbox/coco/pkg/api/v1";

import "google/protobuf/timestamp.proto";
import "proto/coco/v1/cluster.proto";

// =============================================================================
// Enums
// =============================================================================

enum SandboxState {
  SANDBOX_STATE_UNSPECIFIED = 0;
  SANDBOX_STATE_CREATING = 1;
  SANDBOX_STATE_RUNNING = 2;
  SANDBOX_STATE_PAUSED = 3;
  SANDBOX_STATE_STOPPING = 4;
  SANDBOX_STATE_STOPPED = 5;
  SANDBOX_STATE_HIBERNATED = 6;
  SANDBOX_STATE_ERROR = 7;
}

enum TemplateState {
  TEMPLATE_STATE_UNSPECIFIED = 0;
  TEMPLATE_STATE_BUILDING = 1;
  TEMPLATE_STATE_READY = 2;
  TEMPLATE_STATE_ERROR = 3;
}

enum NetworkMode {
  NETWORK_MODE_UNSPECIFIED = 0;
  NETWORK_MODE_BRIDGE = 1;
  NETWORK_MODE_TAP = 2;
  NETWORK_MODE_VSOCK = 3;
  NETWORK_MODE_ISOLATED = 4;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_ADMIN = 1;
  ROLE_OPERATOR = 2;
  ROLE_DEVELOPER = 3;
  ROLE_READONLY = 4;
}

enum Scope {
  SCOPE_UNSPECIFIED = 0;
  SCOPE_SANDBOX_CREATE = 1;
  SCOPE_SANDBOX_READ = 2;
  SCOPE_SANDBOX_WRITE = 3;
  SCOPE_SANDBOX_DELETE = 4;
  SCOPE_TEMPLATE_READ = 5;
  SCOPE_TEMPLATE_WRITE = 6;
  SCOPE_CLUSTER_ADMIN = 7;
}

// Error codes for API error responses (spec 5.1)
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_NOT_FOUND = 1;
  ERROR_CODE_ALREADY_EXISTS = 2;
  ERROR_CODE_INVALID_ARGUMENT = 3;
  ERROR_CODE_PERMISSION_DENIED = 4;
  ERROR_CODE_RESOURCE_EXHAUSTED = 5;
  ERROR_CODE_INTERNAL = 6;
  ERROR_CODE_UNAVAILABLE = 7;
  ERROR_CODE_TIMEOUT = 8;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
  string details = 3;
}

// =============================================================================
// API Key Messages
// =============================================================================

message APIKey {
  string id = 1;
  string name = 2;
  Role role = 3;
  repeated Scope scopes = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp expires_at = 6;
  bool enabled = 7;
}

message CreateAPIKeyRequest {
  string name = 1;
  Role role = 2;
  repeated Scope scopes = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message CreateAPIKeyResponse {
  APIKey key = 1;
  string raw_key = 2;
}

message ListAPIKeysRequest {}

message ListAPIKeysResponse {
  repeated APIKey keys = 1;
}

message DeleteAPIKeyRequest {
  string id = 1;
}

message DeleteAPIKeyResponse {}

message ValidateAPIKeyRequest {
  string key = 1;
}

message ValidateAPIKeyResponse {
  bool valid = 1;
  APIKey api_key = 2;
}

// =============================================================================
// Auth Service (API Key Management)
// =============================================================================

service AuthService {
  rpc CreateAPIKey(CreateAPIKeyRequest) returns (CreateAPIKeyResponse);
  rpc ListAPIKeys(ListAPIKeysRequest) returns (ListAPIKeysResponse);
  rpc DeleteAPIKey(DeleteAPIKeyRequest) returns (DeleteAPIKeyResponse);
  rpc ValidateAPIKey(ValidateAPIKeyRequest) returns (ValidateAPIKeyResponse);
}

// =============================================================================
// Gateway Service (Public REST/gRPC API)
// =============================================================================

service GatewayService {
  // Sandbox lifecycle
  rpc CreateSandbox(CreateSandboxRequest) returns (CreateSandboxResponse);
  rpc GetSandbox(GetSandboxRequest) returns (GetSandboxResponse);
  rpc ListSandboxes(ListSandboxesRequest) returns (ListSandboxesResponse);
  rpc DeleteSandbox(DeleteSandboxRequest) returns (DeleteSandboxResponse);

  // Sandbox control
  rpc PauseSandbox(PauseSandboxRequest) returns (PauseSandboxResponse);
  rpc ResumeSandbox(ResumeSandboxRequest) returns (ResumeSandboxResponse);
  rpc ForkSandbox(ForkSandboxRequest) returns (ForkSandboxResponse);
  rpc HibernateSandbox(HibernateSandboxRequest) returns (HibernateSandboxResponse);
  rpc RestoreSandbox(RestoreSandboxRequest) returns (RestoreSandboxResponse);

  // Execution (spec 2.2)
  rpc Exec(ExecRequest) returns (ExecResponse);
  rpc StreamingExec(StreamingExecRequest) returns (stream ExecChunk);
  rpc InteractiveExec(InteractiveExecRequest) returns (stream ExecChunk); // bidirectional

  // Templates (spec 2.3)
  rpc CreateTemplate(CreateTemplateRequest) returns (CreateTemplateResponse);
  rpc GetTemplate(GetTemplateRequest) returns (GetTemplateResponse);
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse);
  rpc DeleteTemplate(DeleteTemplateRequest) returns (DeleteTemplateResponse);
  rpc BuildTemplate(BuildTemplateRequest) returns (BuildTemplateResponse);

  // Checkpoints
  rpc CreateCheckpoint(CreateCheckpointRequest) returns (CreateCheckpointResponse);
  rpc ListCheckpoints(ListCheckpointsRequest) returns (ListCheckpointsResponse);
  rpc GetCheckpoint(GetCheckpointRequest) returns (GetCheckpointResponse);
  rpc DeleteCheckpoint(DeleteCheckpointRequest) returns (DeleteCheckpointResponse);

  // Cluster (spec 2.4)
  rpc GetClusterInfo(GetClusterInfoRequest) returns (GetClusterInfoResponse);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse);
  rpc DrainNode(DrainNodeRequest) returns (DrainNodeResponse);
}

// =============================================================================
// Sandbox Messages (spec 3.1)
// =============================================================================

message Sandbox {
  string id = 1;
  string name = 2;
  SandboxState state = 3;
  string template_id = 4;
  int32 memory_mb = 5;
  int32 vcpus = 6;
  uint32 vsock_cid = 7;
  int64 pid = 8;
  string parent_id = 9;
  int32 fork_depth = 10;
  map<string, string> labels = 11;
  NetworkMode network_mode = 12;
  string host_node = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
}

message CreateSandboxRequest {
  string name = 1;
  string template_id = 2;
  int32 memory_mb = 3;
  int32 vcpus = 4;
  map<string, string> labels = 5;
  NetworkMode network_mode = 6;
  string working_dir = 7;
}

message CreateSandboxResponse {
  Sandbox sandbox = 1;
}

message GetSandboxRequest {
  string id = 1;
}

message GetSandboxResponse {
  Sandbox sandbox = 1;
}

message ListSandboxesRequest {
  string node_id = 1;
  SandboxState state_filter = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message ListSandboxesResponse {
  repeated Sandbox sandboxes = 1;
  int32 total = 2;
}

message DeleteSandboxRequest {
  string id = 1;
}

message DeleteSandboxResponse {}

message PauseSandboxRequest {
  string id = 1;
}

message PauseSandboxResponse {}

message ResumeSandboxRequest {
  string id = 1;
}

message ResumeSandboxResponse {}

message ForkSandboxRequest {
  string parent_id = 1;
  string name = 2;
  map<string, string> labels = 3;
}

message ForkSandboxResponse {
  Sandbox sandbox = 1;
  int64 duration_ms = 2;
}

message HibernateSandboxRequest {
  string id = 1;
  string checkpoint_name = 2;
}

message HibernateSandboxResponse {
  string checkpoint_id = 1;
}

message RestoreSandboxRequest {
  string checkpoint_id = 1;
  string name = 2;
}

message RestoreSandboxResponse {
  Sandbox sandbox = 1;
}

// =============================================================================
// Execution Messages (spec 2.2)
// =============================================================================

message ExecRequest {
  string sandbox_id = 1;
  string cmd = 2;
  repeated string args = 3;
  repeated string env = 4;
  string working_dir = 5;
  int64 timeout_ms = 6;
}

message ExecResponse {
  int32 exit_code = 1;
  bytes stdout = 2;
  bytes stderr = 3;
  int64 duration_ms = 4;
}

message StreamingExecRequest {
  string sandbox_id = 1;
  string cmd = 2;
  repeated string args = 3;
  repeated string env = 4;
  string working_dir = 5;
  int64 timeout_ms = 6;
}

message InteractiveExecRequest {
  string sandbox_id = 1;
  string cmd = 2;
  repeated string args = 3;
  repeated string env = 4;
  string working_dir = 5;
}

enum StreamType {
  STREAM_TYPE_UNSPECIFIED = 0;
  STREAM_TYPE_STDOUT = 1;
  STREAM_TYPE_STDERR = 2;
  STREAM_TYPE_EXIT = 3;
  STREAM_TYPE_ERROR = 4;
}

message ExecChunk {
  StreamType stream_type = 1;
  bytes data = 2;
  int32 exit_code = 3;
}

// =============================================================================
// Template Messages (spec 2.3)
// =============================================================================

message Template {
  string id = 1;
  string name = 2;
  string description = 3;
  string rootfs = 4;
  string kernel = 5;
  string initrd = 6;
  int32 default_memory_mb = 7;
  int32 default_vcpus = 8;
  int64 size_bytes = 9;
  TemplateState state = 10;
  google.protobuf.Timestamp created_at = 11;
  map<string, string> labels = 12;
}

message CreateTemplateRequest {
  string name = 1;
  string description = 2;
  string rootfs = 3;
  string kernel = 4;
  string initrd = 5;
  int32 default_memory_mb = 6;
  int32 default_vcpus = 7;
  map<string, string> labels = 8;
}

message CreateTemplateResponse {
  Template template = 1;
}

message GetTemplateRequest {
  string id = 1;
}

message GetTemplateResponse {
  Template template = 1;
}

message ListTemplatesRequest {}

message ListTemplatesResponse {
  repeated Template templates = 1;
}

message DeleteTemplateRequest {
  string id = 1;
}

message DeleteTemplateResponse {}

message BuildTemplateRequest {
  string id = 1;
  string image_ref = 2;
}

message BuildTemplateResponse {
  Template template = 1;
  string job_id = 2;
}

// =============================================================================
// Checkpoint Messages (spec 3.4)
// =============================================================================

message Checkpoint {
  string id = 1;
  string sandbox_id = 2;
  string name = 3;
  string path = 4;
  int64 size_bytes = 5;
  bool is_compressed = 6;
  google.protobuf.Timestamp created_at = 7;
}

message CreateCheckpointRequest {
  string sandbox_id = 1;
  string name = 2;
  bool compress = 3;
}

message CreateCheckpointResponse {
  string checkpoint_id = 1;
  int64 size_bytes = 2;
  int64 duration_ms = 3;
}

message ListCheckpointsRequest {
  string sandbox_id = 1;
}

message ListCheckpointsResponse {
  repeated Checkpoint checkpoints = 1;
}

message GetCheckpointRequest {
  string id = 1;
}

message GetCheckpointResponse {
  Checkpoint checkpoint = 1;
}

message DeleteCheckpointRequest {
  string id = 1;
}

message DeleteCheckpointResponse {}

// =============================================================================
// Cluster Messages (spec 2.4)
// =============================================================================

// Cluster types (ClusterInfo, Node, etc.) are defined in cluster.proto

message GetClusterInfoRequest {}

message GetClusterInfoResponse {
  coco.v1.ClusterInfo cluster = 1;
}

message DrainNodeRequest {
  string id = 1;
  bool force = 2;
}

message DrainNodeResponse {}