syntax = "proto3";

package coco.v1;

message ExecRequest {
  string sandbox_id = 1;
  repeated string command = 2;
  string working_dir = 3;
  map<string, string> env = 4;
  bool tty = 5;
  int64 timeout_ms = 6;
}

message ExecResponse {
  string session_id = 1;
  int32 exit_code = 2;
}

message GetExecSessionRequest {
  string session_id = 1;
}

message GetExecSessionResponse {
  string session_id = 1;
  string sandbox_id = 2;
  string state = 3;
}

message ResizeRequest {
  string session_id = 1;
  uint32 width = 2;
  uint32 height = 3;
}

message ResizeResponse {}

message ExecInputRequest {
  string session_id = 1;
  bytes data = 2;
}

message ExecInputResponse {}

message ExecOutputRequest {
  string session_id = 1;
}

message ExecOutputResponse {
  bytes data = 1;
  StreamType type = 2;
}

enum StreamType {
  STDOUT = 0;
  STDERR = 1;
  EXIT = 2;
  SIGNAL = 3;
}
