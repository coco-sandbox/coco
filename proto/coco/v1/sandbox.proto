syntax = "proto3";

package coco.v1;

message Sandbox {
  string id = 1;
  string name = 2;
  string image = 3;
  string state = 4;
  string node_id = 5;
  Resources resources = 6;
  NetworkConfig network = 7;
  int64 created_at = 8;
  int64 started_at = 9;
}

message Resources {
  int32 cpus = 1;
  int64 memory = 2;
  int64 disk = 3;
}

message NetworkConfig {
  string interface = 1;
  string ip = 2;
  string gateway = 3;
  repeated string dns = 4;
}

message CreateSandboxRequest {
  string id = 1;
  string name = 2;
  string image = 3;
  Resources resources = 4;
  NetworkConfig network = 5;
}

message CreateSandboxResponse {
  Sandbox sandbox = 1;
}

message GetSandboxRequest {
  string id = 1;
}

message GetSandboxResponse {
  Sandbox sandbox = 1;
}

message ListSandboxesRequest {}

message ListSandboxesResponse {
  repeated Sandbox sandboxes = 1;
}

message DeleteSandboxRequest {
  string id = 1;
}

message StartSandboxRequest {
  string id = 1;
}

message StopSandboxRequest {
  string id = 1;
}

message GetSandboxStatsRequest {
  string id = 1;
}

message SandboxStats {
  string id = 1;
  double cpu_usage = 2;
  int64 memory_usage = 3;
  int64 disk_usage = 4;
  int64 net_rx = 5;
  int64 net_tx = 6;
}
