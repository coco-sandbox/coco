syntax = "proto3";

package coco.v1;

option go_package = "coco/proto/generated/v1";

import "google/protobuf/timestamp.proto";

message ClusterInfo {
  string id = 1;
  string name = 2;
  int32 node_count = 3;
  int32 sandbox_count = 4;
  string leader = 5;
  string version = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message Node {
  string id = 1;
  string address = 2;
  string status = 3;
  int32 sandbox_count = 4;
  NodeResources resources = 5;
  int64 last_seen = 6;
  bool healthy = 7;
  string addr = 8;
  uint64 memory_used_mb = 9;
  int32 active_sandboxes = 10;
}

message NodeResources {
  int32 cpus = 1;
  int64 memory = 2;
  int64 disk = 3;
  int32 available_cpus = 4;
  int64 available_memory = 5;
  int64 available_disk = 6;
}

message ListNodesRequest {}

message ListNodesResponse {
  repeated Node nodes = 1;
}

message GetNodeRequest {
  string id = 1;
}

message GetNodeResponse {
  Node node = 1;
}

message NodeEvent {
  string node_id = 1;
  EventType type = 2;
  Node node = 3;
}

enum EventType {
  NODE_ADDED = 0;
  NODE_UPDATED = 1;
  NODE_REMOVED = 2;
}
