syntax = "proto3";

package coco.internal;

option go_package = "coco/proto/generated/internal";

message VisorRequest {
  string id = 1;
  RequestType type = 2;
  bytes payload = 3;
}

message VisorResponse {
  string id = 1;
  ResponseStatus status = 2;
  bytes payload = 3;
  string error = 4;
}

enum RequestType {
  REQUEST_TYPE_START = 0;
  REQUEST_TYPE_STOP = 1;
  REQUEST_TYPE_EXEC = 2;
  REQUEST_TYPE_SIGNAL = 3;
  REQUEST_TYPE_STATS = 4;
}

enum ResponseStatus {
  OK = 0;
  ERROR = 1;
}

message StartVMRequest {
  string id = 1;
  string kernel = 2;
  string rootfs = 3;
  int32 cpus = 4;
  int64 memory = 5;
}

message StopVMRequest {
  string id = 1;
}
