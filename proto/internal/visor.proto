syntax = "proto3";
package coco.internal.visor;

service VisorService {
  rpc Boot(BootRequest) returns (BootResponse);
  rpc Exec(ExecRequest) returns (stream ExecChunk);
  rpc Destroy(DestroyRequest) returns (DestroyResponse);
  rpc GetState(GetStateRequest) returns (GetStateResponse);
  rpc Pause(PauseRequest) returns (PauseResponse);
  rpc Resume(ResumeRequest) returns (ResumeResponse);
}

message BootRequest {
  string sandbox_id = 1;
  string rootfs_path = 2;
  uint32 vcpus = 3;
  uint64 memory_mb = 4;
  string kernel_path = 5;
  string initrd_path = 6;
  map<string, string> env = 7;
}

message BootResponse {
  bool success = 1;
  string vsock_addr = 2;
  uint32 vsock_cid = 3;
  uint32 pid = 4;
  string error = 5;
}

message ExecRequest {
  string sandbox_id = 1;
  string command = 2;
  repeated string args = 3;
  map<string, string> env = 4;
  string working_dir = 5;
}

message ExecChunk {
  enum StreamType {
    STDOUT = 0;
    STDERR = 1;
    EXIT_CODE = 2;
  }
  StreamType stream_type = 1;
  bytes data = 2;
}

message DestroyRequest {
  string sandbox_id = 1;
  bool force = 2;
}

message DestroyResponse {
  bool success = 1;
  string error = 2;
}

message GetStateRequest {
  string sandbox_id = 1;
}

message GetStateResponse {
  enum VmState {
    UNKNOWN = 0;
    CREATING = 1;
    RUNNING = 2;
    PAUSED = 3;
    STOPPING = 4;
    STOPPED = 5;
    ERROR = 6;
  }
  VmState state = 1;
  uint32 pid = 2;
  uint32 vsock_cid = 3;
}

message PauseRequest {
  string sandbox_id = 1;
}

message PauseResponse {
  bool success = 1;
  string error = 2;
}

message ResumeRequest {
  string sandbox_id = 1;
}

message ResumeResponse {
  bool success = 1;
  string error = 2;
}