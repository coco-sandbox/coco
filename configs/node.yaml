listen_addr: ":4747"
grpc_addr: ":4748"
shutdown_timeout: 30s

data_dir: "/var/lib/coco"
images_dir: "/var/lib/coco/images"
store_dir: "/var/lib/coco/store"
checkpoints: "/var/lib/coco/checkpoints"
hibernation: "/var/lib/coco/hibernation"
replays: "/var/lib/coco/replays"
templates: "/var/lib/coco/templates"
snapshot_dir: "/var/lib/coco/snapshots"
runtime_dir: "/run/coco"

visor_socket: "/run/coco/visor.sock"
net_socket: "/run/coco/net.sock"

node_id: ""
pool_size: 10
master_addr: "localhost:4746"

cluster:
  enabled: true
  port: 4748
  etcd_endpoints:
    - "localhost:2379"
  election_timeout: 5s
  heartbeat_interval: 1s

vm_pool:
  target_size: 10
  max_wait_time: 5s
  refill_ticker: 30s
  default_memory_mb: 512
  default_vcpus: 2

ratelimit:
  enabled: true
  rps: 100
  burst: 200

auth:
  enabled: true

tls:
  enabled: true
  cert_file: "/etc/coco/tls/node.crt"
  key_file: "/etc/coco/tls/node.key"

metrics:
  enabled: true
  port: 9090
