name: "alpine"
description: "Alpine Linux minimal template"
kernel: "/var/lib/coco/images/vmlinuz"
initrd: "/var/lib/coco/images/alpine/initrd.img"
rootfs: "/var/lib/coco/images/alpine/rootfs.ext4"

default:
  memory_mb: 256
  vcpus: 1
  disk_size_mb: 1024

resources:
  memory:
    min: 128
    max: 8192
  cpu:
    min: 1
    max: 4

network:
  vsock_cid: 0
  enable_tcp: true

packages:
  - "curl"
  - "bash"
